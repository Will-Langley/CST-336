<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="rick.js" defer></script>
    <title>Midterm Project</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="rick.html">CST336 Midterm Project</a>
                <ul class="navbar-nav flex-row gap-3">
                    <li class="nav-item">
                        <a class="nav-link active" href="rick.html">Rick and Morty</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="music.html">Music</a>
                    </li>
                </ul>
            </div>
        </nav>
        <h1>Rick and Morty Character Search</h1>
    </header>
<main class="search-layout">
    <section class="filters">
        <h2>Filters</h2>

        <div class="filter-group">
            <label for="nameInput" class="filter-title">Character Name</label>
            <input type="text" id="nameInput" placeholder="ex: Rick">
            <div id="nameError" class="error-msg"></div>
        </div>

        <div class="filter-group">
            <label class="filter-title">Status</label>
            <label><input type="radio" name="status" value="alive"> Alive</label>
            <label><input type="radio" name="status" value="dead"> Dead</label>
            <label><input type="radio" name="status" value="unknown"> Unknown</label>
        </div>

        <div class="filter-group">
            <label for="genderSelect" class="filter-title">Gender</label>
            <select id="genderSelect">
                <option value="">Any</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="genderless">Genderless</option>
                <option value="unknown">Unknown</option>
            </select>
        </div>
        <button id="resetBtn" >Reset Filters</button>
    </section>

    <section class="results-area">
        <p id="resultsMessage" class="results-msg"></p>
        <div id="results" class="results-grid"></div>
    </section>
</main>

    <footer>
        <p>William Langley</p>
        <p>CST336-01</p>
        <p>Data From Rick and Morty API</p>
    </footer>
</body>
</html>
