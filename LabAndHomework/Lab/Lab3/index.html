
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3: Quiz</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class = "quiz">
        <h1>HTML and CSS Quiz</h1>

        <div class="question">
            <p>1. What HTML element creates a dropdown menu?</p><br>
            <div id="q1Choices"></div>
            <div id="q1Feedback" class="feedback"></div>
        </div>

        <div class="question">
            <label for="q2">2. What CSS property changes the color of text?</label><br>
            <input type="text" id="q2">
            <div id="q2Feedback" class="feedback"></div>
        </div>

        <div class="question">
            <label for="q3">3. Which HTML element creates a hyperlink?</label><br>
            <select id="q3">
                <option value="">-- Choose one --</option>
                <option value="link">link</option>
                <option value="a">a</option>
                <option value="href">href</option>
                <option value="nav">nav</option>
            </select>
            <div id="q3Feedback" class="feedback"></div>
        </div>

        <div class="question">
            <label for="q4">4. How many heading levels (h1, h2, ...) does HTML have?</label><br>
            <input type="number" id="q4" min="1" max="10">
            <div id="q4Feedback" class="feedback"></div>
        </div>

        <div class="question">
            <p>5. Which of these create a dropdown menu or a small clickable circle? (Check all that apply)</p><br>
            <label><input type="checkbox" id="q5Select"> Select</label>
            <label><input type="checkbox" id="q5Dropdown"> Dropdown</label>
            <label><input type="checkbox" id="q5Radio"> Radio</label>
            <label><input type="checkbox" id="q5Menu"> Menu</label>
            <div id="q5Feedback" class="feedback"></div>
        </div>

        <button id="submitBtn">Submit Quiz</button>

        <div id="results">
            <h2 id="totalScore"></h2>
            <p id="congrats"></p>
            <p id="totalAttempts"></p>
        </div>
    </main>
</body>
</html>
